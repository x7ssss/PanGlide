<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#0B0D13" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Rect -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" stroke="#252B3B" stroke-width="8" />
  
  <!-- Outer Focus Reticle (Dashed) -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="none" stroke="#6366F1" stroke-width="8" stroke-dasharray="24 16" opacity="0.6" />
  
  <!-- Camera / Viewport Kinetic Wave Symbol -->
  <path d="M160 256 C200 180, 240 180, 280 256 C320 332, 360 332, 400 256" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Amber Redaction / Target Focus Reticle -->
  <circle cx="280" cy="256" r="36" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="10" />
  <circle cx="280" cy="256" r="12" fill="#F59E0B" />
  <path d="M280 200 L280 216 M280 296 L280 312 M224 256 L240 256 M320 256 L336 256" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
</svg>
